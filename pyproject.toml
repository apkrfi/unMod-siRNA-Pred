[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unMod-siRNA-Pred"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aparajita Karmakar", email = "aparajita.karmakar@rfi.ac.in" }
]


dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.12",
    "joblib>=1.3",
    "tqdm>=4.66",
    "igraph>=0.11",
    "xgboost>=2.0",
    "progressbar2>=4.0",
]

[project.optional-dependencies]
deep-learning = [
    "torch>=2.2",
    "torchvision>=0.17",
]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
]

[project.scripts]
# Uncomment and rename to add a CLI entry point:
# unMod-siRNA-Pred = "unMod_siRNA_Pred.cli:main"


[tool.setuptools]
py-modules = [
    "basic",
    "chaos",
    "CN",
    "config",
    "get_representations",
    "get_single_window_representations",
    "models",
    "numerical_mappings",
    "physico_chemical",
    "run_models",
    "run_sliding_window",
]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.csv"]

# --- Ruff (linter + formatter) ---
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

# --- Mypy ---
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true