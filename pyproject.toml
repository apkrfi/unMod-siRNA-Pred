[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "unMod-siRNA-Pred"
version = "0.1.0"
description = "siRNA activity prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aparajita Karmakar", email = "aparajita.karmakar@rfi.ac.uk" }
]
keywords = ["machine-learning", "data-science", "siRNA"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.12",
    "joblib>=1.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
deep-learning = [
    "torch>=2.2",
    "torchvision>=0.17",
]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
]

[project.scripts]
# siRNA_unmod = "siRNA_unmod.cli:main"


[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.csv"]

# --- Ruff (linter + formatter) ---
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

# --- Mypy ---
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true